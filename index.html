
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
body {
  margin: 0; min-height: 100vh; background: #020817;
  color: #78eaff; font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
}
main { padding: 24px; }
h1 { letter-spacing: 8px; }
.hud {
  width: 210px; height: 210px; margin: 35px auto;
  border: 2px solid #28cfff; border-radius: 50%;
  box-shadow: 0 0 25px #007bff, inset 0 0 30px #005bff;
  display: grid; place-items: center;
  animation: pulse 3s infinite ease-in-out;
}
.core {
  width: 100px; height: 100px; border: 2px solid #9bf3ff;
  border-radius: 50%; box-shadow: 0 0 25px #00bfff;
}
button {
  background: #06294b; color: #a7f4ff;
  border: 1px solid #26dfff; border-radius: 30px;
  padding: 15px 24px; font-size: 16px; margin: 8px;
}
#status, #reply { min-height: 24px; }
@keyframes pulse {
  50% { transform: scale(1.05); box-shadow: 0 0 45px #009dff; }
}
</style>
</head>
<body>
<main>
  <h1>J.A.R.V.I.S.</h1>
  <p>PERSONAL VOICE ASSISTANT</p>
  <div class="hud"><div class="core"></div></div>
  <p id="status">SYSTEM READY</p>
  <p id="reply">Tap below to activate voice.</p>
  <button id="start">ACTIVATE JARVIS</button>
  <button id="stop">STOP</button>
</main>
<script>
const status = document.getElementById("status");
const reply = document.getElementById("reply");
const start = document.getElementById("start");
const stop = document.getElementById("stop");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

let recognition;
let active = false;
let waitingForCommand = false;

function speak(text) {
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-IN";
  utterance.onstart = () => status.textContent = "JARVIS SPEAKING";
  utterance.onend = () => {
    if (active) status.textContent = "LISTENING";
  };
  reply.textContent = text;
  speechSynthesis.speak(utterance);
}

function answer(command) {
  const q = command.toLowerCase();
  if (q.includes("time")) {
    speak("The time is " +
      new Date().toLocaleTimeString("en-IN", {
        hour: "numeric", minute: "2-digit"
      }));
  } else if (q.includes("date")) {
    speak("Today is " +
      new Date().toLocaleDateString("en-IN", {
        day: "numeric", month: "long", year: "numeric"
      }));
  } else if (q.includes("open youtube")) {
    speak("Opening YouTube.");
    window.open("https://m.youtube.com/", "_blank");
  } else if (q.includes("hello") || q.includes("hi")) {
    speak("Hello! JARVIS is online and ready.");
  } else {
    speak("I heard you say: " + command +
      ". Online AI is not connected yet.");
  }
}

start.onclick = () => {
  if (!SpeechRecognition) {
    speak("Speech recognition is not supported in this browser.");
    status.textContent = "VOICE INPUT UNAVAILABLE";
    return;
  }
  if (active) return;

  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = true;
  recognition.interimResults = false;
  active = true;

  recognition.onstart = () => status.textContent = "LISTENING";
  recognition.onerror = e => {
    status.textContent = "VOICE ERROR: " + e.error;
  };
  recognition.onresult = e => {
    const result = e.results[e.results.length - 1];
    if (!result.isFinal) return;

    const text = result[0].transcript.trim();
    reply.textContent = "Heard: " + text;
    const lower = text.toLowerCase();

    if (/\b(hey\s+)?jarvis\b/.test(lower)) {
      const command = lower.replace(/\b(hey\s+)?jarvis\b/, "").trim();
      if (command) {
        waitingForCommand = false;
        answer(command);
      } else {
        waitingForCommand = true;
        speak("Yes, I'm listening. Bolo, what can I do for you?");
      }
    } else if (waitingForCommand) {
      waitingForCommand = false;
      answer(text);
    }
  };
  recognition.onend = () => {
    if (active) {
      try { recognition.start(); } catch (_) {}
    }
  };

  try {
    recognition.start();
    speak("JARVIS activated. Say Hey Jarvis.");
  } catch (_) {
    active = false;
    status.textContent = "TAP TO TRY AGAIN";
  }
};

stop.onclick = () => {
  active = false;
  waitingForCommand = false;
  if (recognition) recognition.stop();
  speechSynthesis.cancel();
  status.textContent = "SYSTEM STANDBY";
  reply.textContent = "Voice listening stopped.";
};
</script>
</body>
</html>
